name: Bygg Chrome-tillägg

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tester
        run: node --test test/calc.test.js

      - name: Sätt version från tagg
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "const f='extension/manifest.json';const m=require('./'+f);m.version='$VER';require('fs').writeFileSync(f,JSON.stringify(m,null,2)+'\n')"

      - name: Paketera zip
        run: |
          VER=$(node -p "require('./extension/manifest.json').version")
          mkdir -p dist
          (cd extension && zip -r "../dist/PP-Planering-${VER}.zip" . -x '*.DS_Store')
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: PP-Planering
          path: dist/*.zip
          if-no-files-found: error

      - name: Publicera release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
